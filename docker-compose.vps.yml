# Local overrides for the personal-infra VPS. Always run together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml ...
#
# Step A of the 1.2.1 upgrade keeps MinIO (v1.2.1 switches the base file to RustFS):
# the minio and minio-init blocks put back the image, command, env, healthcheck and
# bucket init of the 1.0.0 stack. The digests are the images running on 2026-09-30.
services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: !override ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    healthcheck:
      test: !override ['CMD', 'mc', 'ready', 'local']
    mem_limit: 512m
    memswap_limit: 512m

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-planner-attachments}
    entrypoint: !override
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio...'; sleep 2; done;
        mc mb --ignore-existing local/"$$S3_BUCKET";
        echo 'bucket ready: '"$$S3_BUCKET"
    mem_limit: 128m
    memswap_limit: 128m

  # One-shot: dumps the database and applies migrations (the api did this at 512m in 1.0.0).
  migrate:
    mem_limit: 512m
    memswap_limit: 512m

  api:
    mem_limit: 512m
    memswap_limit: 512m
    ports: !override
      - '127.0.0.1:${API_PORT:-8102}:3000'

  web:
    mem_limit: 512m
    memswap_limit: 512m
    ports: !override
      - '127.0.0.1:${WEB_PORT:-8101}:3001'

  postgres:
    mem_limit: 1g
    memswap_limit: 1g

  worker:
    mem_limit: 256m
    memswap_limit: 256m

  bot:
    mem_limit: 128m
    memswap_limit: 128m
